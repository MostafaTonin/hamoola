<svg viewBox="0 0 280 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="truckHaloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roadLineGrad" x1="25" y1="162" x2="255" y2="162" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="172" y1="75" x2="213" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- هالة دائرية دافئة خلف الشاحنة -->
  <circle cx="140" cy="95" r="75" fill="url(#truckHaloGrad)" />
  
  <!-- خطوط الطريق ومسار الحركة اللوجستي -->
  <path d="M25 162H255" stroke="url(#roadLineGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 171H95" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M120 171H170" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M195 171H230" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  
  <!-- خطوط انسياب الهواء والسرعة في المقدمة -->
  <path d="M30 85H55" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M22 97H50" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M38 109H58" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- هيكل الشاحنة الثقيلة المتطورة -->
  <!-- صندوق الحمولة / البضائع الخلفي -->
  <g class="truck-cargo-group">
    <rect x="52" y="70" width="112" height="74" rx="6" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <line x1="75" y1="70" x2="75" y2="144" stroke="#0F172A" stroke-width="2"/>
    <line x1="105" y1="70" x2="105" y2="144" stroke="#0F172A" stroke-width="2"/>
    <line x1="135" y1="70" x2="135" y2="144" stroke="#0F172A" stroke-width="2"/>
    <rect x="52" y="98" width="112" height="14" fill="#F59E0B" fill-opacity="0.95"/>
    <circle cx="108" cy="105" r="4.5" fill="#0F172A"/>
    <path d="M85 105H100" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
    <path d="M116 105H131" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
    <rect x="76" y="44" width="46" height="26" rx="4" fill="#D97706"/>
    <rect x="76" y="55" width="46" height="4" fill="#F59E0B"/>
    <line x1="99" y1="44" x2="99" y2="70" stroke="#B45309" stroke-width="2.5"/>
  </g>
  
  <!-- كابينة القيادة الحديثة للشاحنة -->
  <g class="truck-cab-group">
    <path d="M164 68H196C206.5 68 215.3 75.8 217.2 86.1L224 124C225 129.5 220.8 134.5 215.2 134.5H164V68Z" fill="#0F172A"/>
    <path d="M164 68H196C206.5 68 215.3 75.8 217.2 86.1L224 124C225 129.5 220.8 134.5 215.2 134.5H164V68Z" stroke="#334155" stroke-width="2"/>
    <path d="M172 75H195C201.5 75 207 79.8 208.2 86.2L213.2 112H172V75Z" fill="url(#windowGrad)"/>
    <path d="M185 78L176 108" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M220 120H226C227.1 120 228 120.9 228 122V128C228 129.1 227.1 130 226 130H219L220 120Z" fill="#F59E0B"/>
    <ellipse cx="236" cy="125" rx="8" ry="5" fill="#F59E0B" opacity="0.4"/>
    <rect x="164" y="132" width="63" height="12" rx="3" fill="#1E293B"/>
    <line x1="175" y1="138" x2="218" y2="138" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- شاسيه وقاعدة الشاحنة السفلية -->
  <rect x="52" y="142" width="174" height="8" rx="2" fill="#0F172A"/>
  <rect x="110" y="144" width="38" height="8" rx="2" fill="#334155"/>
  
  <!-- العجلات والإطارات الثقيلة -->
  <g class="truck-wheel wheel-front">
    <circle cx="198" cy="154" r="16" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <circle cx="198" cy="154" r="10" fill="#1E293B"/>
    <circle cx="198" cy="154" r="5" fill="#F59E0B"/>
    <circle cx="198" cy="154" r="2" fill="#FFFFFF"/>
  </g>
  <g class="truck-wheel wheel-rear-1">
    <circle cx="126" cy="154" r="16" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <circle cx="126" cy="154" r="10" fill="#1E293B"/>
    <circle cx="126" cy="154" r="5" fill="#F59E0B"/>
    <circle cx="126" cy="154" r="2" fill="#FFFFFF"/>
  </g>
  <g class="truck-wheel wheel-rear-2">
    <circle cx="82" cy="154" r="16" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <circle cx="82" cy="154" r="10" fill="#1E293B"/>
    <circle cx="82" cy="154" r="5" fill="#F59E0B"/>
    <circle cx="82" cy="154" r="2" fill="#FFFFFF"/>
  </g>
</svg>
