name: flutter_application
description: "Hamoola - Heavy Transportation Marketplace"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Navigation & Routing
  go_router: ^14.8.1

  # Design & Assets
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17

  # Localization & Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.2
  firebase_core: ^4.15.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite_common_ffi: ^2.4.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
